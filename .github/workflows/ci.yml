name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-validation-0123456789
  ENVIRONMENT: test

jobs:
  quality:
    name: Lint, types, security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v4
        with: { enable-cache: true }
      - run: uv sync --all-groups
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run bandit -c pyproject.toml -q -r src tools
      - name: Gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Semgrep (SAST)
        run: |
          uv tool run semgrep scan --config p/python --config p/fastapi --config p/owasp-top-ten --error --metrics=off src

  dependencies:
    name: Dependency governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Vet packages added or upgraded in this change
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }}
          PYTHONPATH=tools python -m depguard audit --changed --base ${{ github.event.pull_request.base.sha }} --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Full lockfile audit (policy on direct deps + OSV on every pin)
        run: PYTHONPATH=tools python -m depguard audit --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: pip-audit (second advisory source)
        run: |
          uv export --no-dev --no-hashes -q -o /tmp/requirements.txt
          uv tool run pip-audit --strict --progress-spinner off -r /tmp/requirements.txt

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { enable-cache: true }
      - run: uv sync --all-groups
      - run: uv run pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  container:
    name: Build & scan image
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, load: true, tags: "app:ci" }
      - name: Trivy image scan (readable report, gates the job)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy image scan (SARIF for the Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app:ci
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-setup-trivy: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy.sarif }

  compose-smoke:
    name: Docker route (compose up + request flow)
    runs-on: ubuntu-latest
    needs: [container]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -base64 48 | tr -d '\n=/+')|" .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Readiness and auth flow
        run: |
          set -euxo pipefail
          curl -fsS http://localhost:8000/api/v1/health/ready | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -o /dev/null -w "%{http_code}\n" -X POST http://localhost:8000/api/v1/users \
            -H 'Authorization: Bearer x' -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"correct-horse-battery-staple"}' | grep -q 201
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/v1/auth/login \
            -H 'Authorization: Bearer x' -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"correct-horse-battery-staple"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://localhost:8000/api/v1/users/me -H "Authorization: Bearer $TOKEN" | grep -q '"email":"ci@example.com"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
