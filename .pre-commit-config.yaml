# Install: uv run pre-commit install --install-hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.4
    hooks:
      - id: uv-lock          # lockfile must match pyproject.toml

  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -q -r src tools
        language: system
        pass_filenames: false
        types: [python]
      - id: depguard
        name: depguard (vet new/upgraded dependencies)
        entry: env PYTHONPATH=tools uv run python -m depguard audit --changed --base HEAD
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|depguard\.toml)$
